name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pdfdad
          create-args: python=3.12 tesseract ghostscript
          condarc: |
            channels: [conda-forge]
      - name: Spanish OCR model
        shell: bash -el {0}
        run: |
          # put the models into the environment's own tessdata folder (no TESSDATA_PREFIX needed)
          TD="$CONDA_PREFIX/share/tessdata"; [ -d "$CONDA_PREFIX/Library/share/tessdata" ] && TD="$CONDA_PREFIX/Library/share/tessdata"
          for m in spa eng; do curl -sSL -o "$TD/$m.traineddata" https://github.com/tesseract-ocr/tessdata_fast/raw/main/$m.traineddata; done
          curl -sSL -o "$TD/osd.traineddata" https://github.com/tesseract-ocr/tessdata/raw/main/osd.traineddata
          # conda-forge on Windows keeps configs in Library/share/tessdata but models in share/tessdata
          CFG=$(find "$CONDA_PREFIX" -type d -name configs -path '*tessdata*' | head -1)
          for d in "$CONDA_PREFIX/share/tessdata" "$CONDA_PREFIX/Library/share/tessdata"; do
            [ -d "$d" ] && cp -r "$CFG" "$(dirname "$CFG")/tessconfigs" "$d/" 2>/dev/null || true
            [ -d "$d" ] && cp "$TD"/*.traineddata "$d/" 2>/dev/null || true
          done
          tesseract --list-langs | head -3
      - name: Install
        shell: bash -el {0}
        run: python -m pip install -r installer/requirements.txt pytest
      - name: Test
        shell: bash -el {0}
        run: python -m pytest -q tests
