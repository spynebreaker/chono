name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pdfdad
          create-args: python=3.12 tesseract ghostscript
          condarc: |
            channels: [conda-forge]
      - name: Spanish OCR model
        shell: bash -el {0}
        run: |
          mkdir -p tessdata
          curl -sSL -o tessdata/spa.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/spa.traineddata
          curl -sSL -o tessdata/osd.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/osd.traineddata
          curl -sSL -o tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          echo "TESSDATA_PREFIX=$PWD/tessdata" >> $GITHUB_ENV
      - name: Install
        shell: bash -el {0}
        run: python -m pip install -r installer/requirements.txt pytest
      - name: Test
        shell: bash -el {0}
        run: python -m pytest -q tests
